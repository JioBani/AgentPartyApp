<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파티 단일 창구</title>
<style>
@font-face{font-family:"Maplestory";font-weight:400;font-style:normal;font-display:swap;src:url("../../src/renderer/assets/fonts/Maplestory-Light.woff2") format("woff2")}
@font-face{font-family:"Maplestory";font-weight:700;font-style:normal;font-display:swap;src:url("../../src/renderer/assets/fonts/Maplestory-Bold.woff2") format("woff2")}

/* === AgentParty theme tokens (src/renderer/theme/themes.ts) === */
:root{
  color-scheme:light;
  --bg-0:#e7e8eb;--bg-1:#f3f4f6;--bg-2:#ffffff;--bg-3:#eef0f3;--bg-4:#e6e9ed;--bg-input:#ffffff;
  --border-subtle:#e2e5ea;--border:#d3d7df;--border-strong:#c0c5ce;
  --text-0:#171a1f;--text-1:#454b56;--text-2:#6c7480;--text-3:#9aa1ac;
  --accent:#3f6fe6;--accent-dim:rgba(63,111,230,.1);--accent-bd:rgba(63,111,230,.28);--accent-fg:#ffffff;
  --live:#b9791d;--live-dim:rgba(185,121,29,.13);--live-bd:rgba(185,121,29,.3);
  --success:#2f8f5e;--success-dim:rgba(47,143,94,.13);--success-bd:rgba(47,143,94,.28);
  --danger:#cf4b45;--danger-dim:rgba(207,75,69,.13);--danger-bd:rgba(207,75,69,.3);
  --warning:#b07816;--warning-dim:rgba(176,120,22,.13);--warning-bd:rgba(176,120,22,.3);
  --scrim:rgba(20,23,29,.42);--shadow:rgba(20,23,29,.13);--shadow-strong:rgba(20,23,29,.2);

  --radius-window:9px;--radius-panel:11px;--radius-card:10px;--radius-button:7px;--radius-input:8px;--radius-pill:6px;--radius-badge:5px;--border-width:1px;

  --font-sans:"Maplestory",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SF Mono","JetBrains Mono",Consolas,monospace;
  --space-1:4px;--space-2:6px;--space-3:8px;--space-4:10px;--space-5:12px;--space-6:16px;--space-7:20px;--space-8:26px;
  --sidebar-width:236px;
  /* Router gets the `live` family — it's the party's traffic, not a member. */
  --router:var(--live);--router-dim:var(--live-dim);--router-bd:var(--live-bd);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg-0:#0a0b0e;--bg-1:#0e1014;--bg-2:#14171d;--bg-3:#1b1f27;--bg-4:#222731;--bg-input:#0c0e12;
    --border-subtle:#1c2028;--border:#262b35;--border-strong:#333a46;
    --text-0:#e7e9ee;--text-1:#aeb4c0;--text-2:#79808d;--text-3:#535965;
    --accent:#5b8cff;--accent-dim:rgba(91,140,255,.13);--accent-bd:rgba(91,140,255,.32);
    --live:#e0a14e;--live-dim:rgba(224,161,78,.13);--live-bd:rgba(224,161,78,.34);
    --success:#54b585;--success-dim:rgba(84,181,133,.13);--success-bd:rgba(84,181,133,.32);
    --danger:#e0635d;--danger-dim:rgba(224,99,93,.13);--danger-bd:rgba(224,99,93,.34);
    --warning:#d9a441;--warning-dim:rgba(217,164,65,.16);--warning-bd:rgba(217,164,65,.34);
    --scrim:rgba(0,0,0,.5);--shadow:rgba(0,0,0,.4);--shadow-strong:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg-0:#0a0b0e;--bg-1:#0e1014;--bg-2:#14171d;--bg-3:#1b1f27;--bg-4:#222731;--bg-input:#0c0e12;
  --border-subtle:#1c2028;--border:#262b35;--border-strong:#333a46;
  --text-0:#e7e9ee;--text-1:#aeb4c0;--text-2:#79808d;--text-3:#535965;
  --accent:#5b8cff;--accent-dim:rgba(91,140,255,.13);--accent-bd:rgba(91,140,255,.32);
  --live:#e0a14e;--live-dim:rgba(224,161,78,.13);--live-bd:rgba(224,161,78,.34);
  --success:#54b585;--success-dim:rgba(84,181,133,.13);--success-bd:rgba(84,181,133,.32);
  --danger:#e0635d;--danger-dim:rgba(224,99,93,.13);--danger-bd:rgba(224,99,93,.34);
  --warning:#d9a441;--warning-dim:rgba(217,164,65,.16);--warning-bd:rgba(217,164,65,.34);
  --scrim:rgba(0,0,0,.5);--shadow:rgba(0,0,0,.4);--shadow-strong:rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-sans);font-size:13px;line-height:1.5;color:var(--text-0);background:var(--bg-1);-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
code{font-family:var(--font-mono);font-size:.92em;padding:0 4px;border-radius:4px;background:var(--bg-3);border:var(--border-width) solid var(--border-subtle)}
:focus-visible{outline:2px solid var(--accent-bd);outline-offset:1px}
#root{height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{height:100%;display:flex;background:var(--bg-1)}

/* sidebar — .wb-sidebar */
.sb{width:var(--sidebar-width);flex:none;background:var(--bg-0);border-right:var(--border-width) solid var(--border-subtle);display:flex;flex-direction:column;min-height:0}
.sb-head{height:44px;display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-4);border-bottom:var(--border-width) solid var(--border-subtle)}
.sb-party{flex:1;font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-sec{padding:var(--space-5) var(--space-4) var(--space-3);display:flex;flex-direction:column;gap:4px}
.sb-label{font-size:10.5px;color:var(--text-3);letter-spacing:.04em;padding:0 var(--space-2) 4px}
.row{display:flex;align-items:center;gap:var(--space-3);height:38px;padding:0 var(--space-4);border:var(--border-width) solid transparent;border-radius:var(--radius-card);background:transparent;text-align:left;width:100%}
.row:hover{background:var(--bg-2)}
.row.is-open{background:var(--member-soft,var(--accent-dim));border-color:var(--member-bd,var(--accent-bd))}
.row-name{flex:1;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-status{font-size:10.5px;color:var(--text-3)}
.row-status.is-busy{color:var(--member)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--member,var(--text-3));flex:none}
.dot.is-busy{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.count{font-size:10px;font-weight:700;min-width:18px;height:17px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}

.router-card{margin:auto var(--space-4) var(--space-4);padding:var(--space-5);border:var(--border-width) dashed var(--router-bd);border-radius:var(--radius-card);background:var(--router-dim);display:flex;flex-direction:column;gap:6px}
.router-title{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12px;color:var(--router)}
.router-stats{display:flex;gap:10px;font-size:11px;color:var(--text-1);font-variant-numeric:tabular-nums}
.router-note{font-size:10.5px;color:var(--text-2)}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);font-size:11px;text-align:left}
.linkbtn:hover{text-decoration:underline}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{height:40px;flex:none;display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-4) 0 var(--space-6);border-bottom:var(--border-width) solid var(--border-subtle);background:var(--bg-1)}
.bar strong{font-size:12.5px}
.bar-sub{font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{margin-left:auto;display:flex;gap:2px;padding:2px;border-radius:var(--radius-button);background:var(--bg-3);border:var(--border-width) solid var(--border-subtle);flex:none}
.tab{height:24px;padding:0 10px;border:none;border-radius:5px;background:transparent;color:var(--text-2);font-size:11.5px;font-weight:700}
.tab.is-on{background:var(--bg-2);color:var(--text-0);box-shadow:0 1px 2px var(--shadow)}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border:var(--border-width) solid transparent;border-radius:var(--radius-button);background:transparent;color:var(--text-2);flex:none}
.iconbtn:hover{background:var(--bg-3);color:var(--text-0)}
.menu-btn{display:none}

.body{flex:1;min-height:0;display:flex}
.feed{flex:1;min-width:0;overflow-y:auto;padding:var(--space-7) var(--space-7) var(--space-6)}
.feed-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* user — .wb-user */
.u{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.u-head{font-size:10px;color:var(--text-3)}
.u-bubble{max-width:85%;padding:8px 11px;background:var(--bg-3);border:var(--border-width) solid var(--border-subtle);border-radius:9px 9px 3px 9px;white-space:pre-wrap;word-break:break-word;font-size:12.5px;line-height:1.6}
.mention{color:var(--accent);font-weight:700}

/* routing trace line */
.route{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--text-2);padding-left:2px}
.route-ico{color:var(--router);display:grid;place-items:center}
.route b{color:var(--text-0);font-weight:700}
.route .who{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--member)}
.route-why{color:var(--text-3)}
.chipbtn{height:22px;padding:0 8px;border:var(--border-width) solid var(--border);border-radius:var(--radius-pill);background:var(--bg-2);color:var(--text-1);font-size:10.5px}
.chipbtn:hover{border-color:var(--border-strong);color:var(--text-0)}
.route.is-pending .route-ico{animation:pulse 1.2s ease-in-out infinite}
.reroute{position:relative}
.pop{position:absolute;top:26px;left:0;z-index:20;min-width:150px;padding:4px;background:var(--bg-2);border:var(--border-width) solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:0 8px 24px var(--shadow)}
.pop button{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 8px;border:none;border-radius:6px;background:transparent;font-size:12px;text-align:left}
.pop button:hover{background:var(--bg-3)}
.pop.up{top:auto;bottom:34px}

/* assistant — .wb-assistant */
.a{display:flex;flex-direction:column;gap:7px;padding-left:10px;border-left:2px solid var(--member-bd)}
.a-head{display:flex;align-items:center;gap:6px}
.a-head strong{font-size:11px;color:var(--member)}
.time{font-size:10px;color:var(--text-3)}
.badge{height:16px;padding:0 6px;border-radius:4px;font-size:9.5px;font-weight:700;display:inline-flex;align-items:center;background:var(--router-dim);border:var(--border-width) solid var(--router-bd);color:var(--router)}
.a-body{font-size:12.5px;line-height:1.6;word-break:break-word}
.a-foot{display:flex;gap:8px}
.work-link{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--radius-pill);border:var(--border-width) solid var(--border-subtle);background:var(--bg-2);color:var(--text-2);font-size:10.5px}
.work-link:hover{color:var(--member);border-color:var(--member-bd)}

/* held card */
.held{padding:10px 12px;border:var(--border-width) dashed var(--router-bd);border-radius:var(--radius-card);background:var(--router-dim);display:flex;flex-direction:column;gap:6px}
.held-title{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--router)}
.held-msg{font-size:12px;color:var(--text-0)}
.held-why{font-size:11px;color:var(--text-2)}
.held-act{display:flex;gap:6px;margin-top:2px}
.btn{height:26px;padding:0 10px;border:var(--border-width) solid var(--border);border-radius:var(--radius-button);background:var(--bg-2);font-size:11.5px;font-weight:700;color:var(--text-0)}
.btn:hover{border-color:var(--border-strong)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.held.is-done{border-style:solid;border-color:var(--border-subtle);background:var(--bg-2)}
.held.is-done .held-title{color:var(--text-2)}

.typing{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3);padding-left:12px}
.typing .dot{width:6px;height:6px}

/* composer — .wb-composer */
.composer{flex:none;padding:9px var(--space-7) var(--space-6);border-top:var(--border-width) solid var(--border-subtle);background:var(--bg-1)}
.composer-in{max-width:760px;margin:0 auto}
.cbox{border:var(--border-width) solid var(--border);border-radius:var(--radius-card);background:var(--bg-2);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.cbox:focus-within{border-color:var(--accent-bd)}
.cbox textarea{width:100%;min-height:40px;max-height:160px;resize:none;border:none;background:transparent;outline:none;line-height:1.5;font-size:12.5px}
.cbar{display:flex;align-items:center;gap:6px}
.target{position:relative}
.target-btn{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border:var(--border-width) solid var(--border);border-radius:var(--radius-pill);background:var(--bg-3);font-size:11px;font-weight:700;color:var(--text-1)}
.hint{font-size:10.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.send{margin-left:auto;width:30px;height:30px;border:none;border-radius:var(--radius-button);background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.4;cursor:default}

/* drawer — member workspace */
.drawer{width:420px;flex:none;border-left:var(--border-width) solid var(--border-subtle);background:var(--bg-2);display:flex;flex-direction:column;min-height:0}
.dr-head{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 var(--space-3) 0 var(--space-6);border-bottom:var(--border-width) solid var(--border-subtle)}
.dr-head strong{font-size:12.5px;color:var(--member)}
.dr-sub{font-size:10.5px;color:var(--text-3)}
.dr-body{flex:1;overflow-y:auto;padding:var(--space-6);display:flex;flex-direction:column;gap:10px}
.dr-label{font-size:10.5px;color:var(--text-3)}
.inbox{padding:8px 10px;border-radius:var(--radius-card);background:var(--bg-3);border:var(--border-width) solid var(--border-subtle);font-size:12px}
.inbox small{display:block;color:var(--text-3);font-size:10px;margin-top:2px}
.tool{display:flex;align-items:center;gap:6px;padding:var(--space-3) var(--space-4);border:var(--border-width) solid var(--border);border-radius:var(--radius-card);background:var(--bg-1)}
.tool-check{width:16px;height:16px;display:grid;place-items:center;border-radius:var(--radius-badge);background:var(--success-dim);color:var(--success);flex:none}
.tool-check.held{background:var(--router-dim);color:var(--router)}
.tool-name{font-size:11.5px;font-weight:700}
.tool-arg{font-size:11px;color:var(--text-2);font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tool-meta{font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.think{font-size:12px;line-height:1.6;color:var(--text-1)}
.priv{align-self:flex-end;max-width:90%;padding:7px 10px;border-radius:9px 9px 3px 9px;background:var(--member-soft);border:var(--border-width) solid var(--member-bd);font-size:12px}
.dr-foot{flex:none;padding:var(--space-4) var(--space-6) var(--space-6);border-top:var(--border-width) solid var(--border-subtle);display:flex;flex-direction:column;gap:6px}
.dr-foot-note{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-2)}
.dr-input{display:flex;gap:6px}
.dr-input input{flex:1;min-width:0;height:32px;padding:0 10px;border:var(--border-width) solid var(--border);border-radius:var(--radius-input);background:var(--bg-input);outline:none;font-size:12px}
.dr-input input:focus{border-color:var(--member-bd)}
.dr-input .btn{height:32px;background:var(--member);border-color:var(--member);color:#fff}

/* router log */
.log{flex:1;overflow:auto;padding:var(--space-7)}
.log-in{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filter{height:26px;padding:0 10px;border-radius:13px;border:var(--border-width) solid var(--border-subtle);background:transparent;color:var(--text-2);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.filter.is-on{background:var(--bg-2);border-color:var(--border);color:var(--text-0)}
.table-wrap{overflow-x:auto;border:var(--border-width) solid var(--border-subtle);border-radius:var(--radius-panel);background:var(--bg-2)}
table{width:100%;border-collapse:collapse;min-width:720px}
th{font-size:10.5px;font-weight:700;color:var(--text-3);text-align:left;padding:9px 12px;border-bottom:var(--border-width) solid var(--border-subtle)}
td{padding:10px 12px;border-bottom:var(--border-width) solid var(--border-subtle);vertical-align:top;font-size:12px}
tr:last-child td{border-bottom:none}
td.t{font-family:var(--font-mono);font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.act{display:inline-flex;height:18px;padding:0 6px;border-radius:4px;font-size:10px;font-weight:700;align-items:center;white-space:nowrap}
.act.deliver{background:var(--success-dim);color:var(--success);border:var(--border-width) solid var(--success-bd)}
.act.hold{background:var(--router-dim);color:var(--router);border:var(--border-width) solid var(--router-bd)}
.act.digest{background:var(--accent-dim);color:var(--accent);border:var(--border-width) solid var(--accent-bd)}
.act.direct{background:var(--bg-3);color:var(--text-1);border:var(--border-width) solid var(--border)}
.why{display:block;color:var(--text-2);font-size:11px;margin-top:2px}
.path{white-space:nowrap}
.path .who{font-weight:700;color:var(--member)}

.scrim{display:none}

@media (max-width:860px){
  .sb{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:transform .15s ease;box-shadow:0 0 40px var(--shadow-strong)}
  .sb.is-open{transform:none}
  .scrim.is-on{display:block;position:fixed;inset:0;background:var(--scrim);z-index:30}
  .menu-btn{display:grid}
  .bar{padding-left:var(--space-3)}
  .bar-sub{display:none}
  .drawer{position:fixed;inset:0;width:auto;z-index:45}
  .feed,.log{padding:var(--space-6) 16px}
  .composer{padding:9px 16px 16px}
  .hint{display:none}
}
</style>

</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
(function(){
const {useState,useRef,useEffect}=React;
const html=htm.bind(React.createElement);

/* memberColors.ts — NAMED_COLORS */
const COLORS={lead:"#3ac6d6",backend:"#5b8cff",frontend:"#a07bff",tester:"#e0a14e"};
function hexA(hex,a){const v=hex.replace("#","");const r=parseInt(v.slice(0,2),16),g=parseInt(v.slice(2,4),16),b=parseInt(v.slice(4,6),16);return `rgba(${r}, ${g}, ${b}, ${a})`}
function mvars(name){const c=COLORS[name]||"#5b8cff";return {"--member":c,"--member-dim":hexA(c,.13),"--member-soft":hexA(c,.08),"--member-bd":hexA(c,.42)}}

const MEMBERS=[
  {name:"lead",role:"오케스트레이터"},
  {name:"backend",role:"API · 인증"},
  {name:"frontend",role:"로그인 UI"},
  {name:"tester",role:"회귀 테스트"},
];

/* Router stand-in: keyword scoring over each member's scope. */
const SCOPE={
  backend:["토큰","api","서버","세션","인증","db","갱신","401","쿠키"],
  frontend:["화면","ui","폼","버튼","문구","디자인","css","레이아웃","로그인 폼"],
  tester:["테스트","qa","검증","회귀","재현","시나리오"],

  useEffect(()=>{const el=feedRef.current;if(el)el.scrollTop=el.scrollHeight},[feed.length,view]);

  const push=(...items)=>setFeed(f=>[...f,...items]);
  const addLog=e=>setLog(l=>[{id:"l"+nid(),t:now(),...e},...l]);

  function deliver(to,routeId){
    setBusy(b=>({...b,[to]:true}));
    setTimeout(()=>{
      push({id:nid(),kind:"reply",from:to,time:now(),text:REPLY[to],steps:3+Math.floor(Math.random()*6)});
      setBusy(b=>({...b,[to]:false}));
    },1600);
  }

  function send(e){
    e&&e.preventDefault();
    const t=text.trim();if(!t)return;
    const direct=target||mentionOf(t);
    const uidv=nid(),rid=nid();
    setText("");
    if(direct){
      push({id:uidv,kind:"user",text:t,time:now()},{id:rid,kind:"route",to:direct,why:"사용자 직접 지정",how:"direct"});
      addLog({from:["사용자"],to:direct,act:"direct",label:"직접 지정",msg:"“"+t+"”",why:""});
      deliver(direct);return;
    }
    push({id:uidv,kind:"user",text:t,time:now()},{id:rid,kind:"route",pending:true});
    setTimeout(()=>{
      const to=route(t);
      setFeed(f=>f.map(x=>x.id===rid?{id:rid,kind:"route",to,why:WHY[to],how:"auto"}:x));
      addLog({from:["사용자"],to,act:"deliver",label:"전달",msg:"“"+t+"”",why:WHY[to]});
      deliver(to);
    },700);
  }

  function reroute(id,to){
    setFeed(f=>f.map(x=>x.id===id?{...x,to,why:"사용자가 변경",how:"direct"}:x));
    addLog({from:["사용자"],to,act:"direct",label:"재지정",msg:"라우팅 결과를 사용자가 변경",why:""});
    deliver(to);
  }
  function resolve(id,state){
    setFeed(f=>f.map(x=>x.id===id?{...x,state}:x));

        <span class="bar-sub">${view==="chat"?"사람에게 보여줄 출력만 이곳에 모입니다":"라우터가 내린 판단과 이유"}</span>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" aria-selected=${view==="chat"} class=${"tab"+(view==="chat"?" is-on":"")} onClick=${()=>setView("chat")}>대화</button>
          <button type="button" role="tab" aria-selected=${view==="log"} class=${"tab"+(view==="log"?" is-on":"")} onClick=${()=>{setView("log");setDrawer(null)}}>라우팅 기록</button>
        </div>
        <button type="button" class="iconbtn" aria-label="테마 전환" onClick=${toggleTheme}>${Ico.sun}</button>
      </div>

      ${view==="log"?html`<${RouterLog} log=${log}/>`:html`<div class="body">
        <div style=${{flex:1,minWidth:0,display:"flex",flexDirection:"column"}}>
          <div class="feed" ref=${feedRef}><div class="feed-in">
            ${feed.map(it=>{
              if(it.kind==="user")return html`<div class="u" key=${it.id}><div class="u-head">나 · ${it.time}</div><div class="u-bubble">${mentionOf(it.text)?html`<span class="mention">@${mentionOf(it.text)}</span>${it.text.slice(mentionOf(it.text).length+1)}`:it.text}</div></div>`;
              if(it.kind==="route")return html`<${RouteLine} key=${it.id} item=${it} onReroute=${reroute}/>`;
              if(it.kind==="reply")return html`<${Reply} key=${it.id} item=${it} onOpen=${setDrawer}/>`;
              if(it.kind==="held")return html`<${Held} key=${it.id} item=${it} onResolve=${resolve}/>`;
            })}
            ${Object.entries(busy).filter(([m,b])=>b&&m!=="backend").map(([m])=>html`<div class="typing" key=${"t"+m} style=${mvars(m)}><span class="dot is-busy"></span>${m} 작업 중…</div>`)}
          </div></div>
          <form class="composer" onSubmit=${send}><div class="composer-in"><div class="cbox">
            <label for="composer-input" style=${{position:"absolute",width:"1px",height:"1px",overflow:"hidden"}}>파티에게 메시지</label>
            <textarea id="composer-input" rows="2" value=${text} onInput=${e=>setText(e.target.value)} onKeyDown=${onKey}
              placeholder="파티에게 말하기 · 라우터가 담당 멤버를 정합니다. @이름으로 직접 지정"></textarea>
            <div class="cbar">
              <span class="target pop-host">
                <button type="button" class="target-btn" aria-expanded=${pick} onClick=${()=>setPick(!pick)} style=${target?mvars(target):null}>
                  ${target?html`<span class="dot"></span>${target}`:html`<span class="route-ico">${Ico.route}</span>${liveMention?"@"+liveMention:"받는 사람: 자동"}`}${Ico.chev}
                </button>
                ${pick&&html`<${MemberPicker} up includeAuto onClose=${()=>setPick(false)} onPick=${m=>{setTarget(m);setPick(false)}}/>`}
              </span>
              <span class="hint">Enter 전송 · Shift+Enter 줄바꿈 · 예: “로그인 버튼 색 바꿔줘”, “만료 회귀 테스트 돌려줘”</span>
              <button type="submit" class="send" aria-label="보내기" disabled=${!text.trim()}>${Ico.up}</button>
            </div>
          </div></div></form>
        </div>
        ${drawer&&html`<${Drawer} key=${drawer} name=${drawer} priv=${priv[drawer]||[]} onClose=${()=>setDrawer(null)} onSend=${(n,m)=>setPriv(p=>({...p,[n]:[...(p[n]||[]),m]}))}/>`}
      </div>`}
    </main>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();
</script>

</body>
</html>
