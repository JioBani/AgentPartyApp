<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentParty 발표 — 기능 목록 / 시연 배분</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b24; --line:#2a3240;
    --tx:#e6edf3; --dim:#8b98a9; --dim2:#5f6b7d;
    --demo:#3fb950; --intro:#39c5bb; --mock:#d29922; --slide:#58a6ff; --skip:#484f5c;
    --star:#f0b429; --warn:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:14px/1.55 "Pretendard","Malgun Gothic",-apple-system,system-ui,sans-serif}
  code{background:#1c222d;border:1px solid #262d38;border-radius:4px;padding:0 4px;
    font:12px/1 Consolas,monospace;color:#b6c6da}

  header{position:sticky;top:0;z-index:20;background:rgba(14,17,23,.95);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:13px 24px 11px}
  h1{margin:0 0 2px;font-size:17px;letter-spacing:-.2px}
  .sub{color:var(--dim);font-size:12.5px}
  .sub b{color:var(--tx)}

  .modes{display:flex;gap:0;margin:11px 0 0;border:1px solid var(--line);
    border-radius:8px;overflow:hidden;width:fit-content}
  .modes button{background:transparent;border:0;color:var(--dim);padding:7px 17px;
    font:13px/1 inherit;cursor:pointer;border-right:1px solid var(--line)}
  .modes button:last-child{border-right:0}
  .modes button.on{background:#243044;color:#cfe3ff}

  .bar{display:flex;gap:18px;align-items:center;margin-top:11px;flex-wrap:wrap}
  .budget{flex:1;min-width:260px}
  .track{height:9px;border-radius:99px;background:#222a36;overflow:hidden}
  .fill{background:var(--demo);height:100%;transition:width .25s}
  .fill.over{background:var(--warn)}
  .btime{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:5px}
  .btime b{color:var(--tx);font-variant-numeric:tabular-nums}
  .counts{display:flex;gap:7px}
  .cnt{background:var(--panel);border:1px solid var(--line);border-radius:7px;
    padding:5px 11px;font-size:12px;color:var(--dim);white-space:nowrap}
  .cnt b{font-size:14px;font-variant-numeric:tabular-nums;margin-left:3px}
  .cnt.d b{color:var(--demo)} .cnt.i b{color:var(--intro)} .cnt.k b{color:var(--mock)}
  .cnt.s b{color:var(--slide)} .cnt.x b{color:var(--dim2)}

  .filters{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .f{background:var(--panel);border:1px solid var(--line);color:var(--dim);
    border-radius:99px;padding:5px 13px;font:12.5px/1.3 inherit;cursor:pointer}
  .f:hover{color:var(--tx);border-color:#3a4454}
  .f.on{background:#243044;border-color:#3f5878;color:#cfe3ff}
  .f.ghost{background:transparent}
  .spacer{flex:1}

  main{padding:18px 24px 92px;max-width:1240px}
  h2{font-size:13.5px;margin:26px 0 7px;display:flex;align-items:center;gap:9px}
  h2 .tag{font-size:11.5px;color:var(--dim2);font-weight:400}
  h2::before{content:"";width:3px;height:14px;background:#3f5878;border-radius:2px}
  .ct{font-size:11px;letter-spacing:.14em;color:var(--dim2);text-transform:uppercase;
    margin:34px 0 2px;border-top:1px solid #1c222d;padding-top:16px}
  .ct:first-child{margin-top:0;border-top:0;padding-top:0}

  table{width:100%;border-collapse:collapse}
  tr.row{border-bottom:1px solid #1e2530}
  tr.row:hover{background:#141a23}
  tr.row.drag{opacity:.35}
  tr.row.over td{border-top:2px solid var(--demo)}
  td{padding:8px;vertical-align:top}
  .hd{width:22px;color:#39414f;cursor:grab;padding-top:11px;text-align:center;user-select:none}
  .hd:active{cursor:grabbing}
  .id{color:var(--dim2);font-size:11.5px;width:56px;white-space:nowrap;padding-top:10px;
    font-variant-numeric:tabular-nums}
  .nm{width:190px;font-weight:600;font-size:13.5px;cursor:pointer}
  .nm .star{color:var(--star);margin-left:3px}
  .nm .area{display:block;font-weight:400;font-size:11px;color:var(--dim2);margin-top:2px}
  .ds{color:var(--dim);font-size:12.5px;cursor:pointer}
  .ds .sc{display:none;margin-top:6px;padding:7px 9px;background:#12171f;
    border-left:2px solid #2a3240;border-radius:0 5px 5px 0;color:#8b98a9;font-size:11.5px;line-height:1.65}
  tr.open .ds .sc{display:block}
  .ds .sc b{color:var(--dim2);font-weight:600}
  .ds .w{display:block;color:var(--warn);font-size:11.5px;margin-top:4px}
  .ds .note{display:block;color:#7d8a9c;font-size:11.5px;margin-top:4px;font-style:italic}
  .ds .more{color:var(--dim2);font-size:11px;margin-left:5px}

  .verdict{width:82px;text-align:right;white-space:nowrap}
  .v{border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:11.5px/1.3 inherit;
    cursor:pointer;background:var(--panel);color:var(--dim);width:70px}
  .v.demo{background:rgba(63,185,80,.13);border-color:#2c6b38;color:#7ee08a}
  .v.intro{background:rgba(57,197,187,.13);border-color:#1f6f6a;color:#6fdcd3}
  .v.mock{background:rgba(210,153,34,.14);border-color:#7a5a13;color:#e3bd63}
  .v.slide{background:rgba(88,166,255,.12);border-color:#2b5480;color:#93c5fd}
  .v.skip{background:transparent;border-color:#262d38;color:var(--dim2)}
  .min{width:62px;text-align:right;white-space:nowrap;padding-top:10px}
  .min input{width:42px;background:var(--panel);border:1px solid var(--line);color:var(--tx);
    border-radius:5px;padding:3px 5px;text-align:right;font:12px/1.3 inherit}
  .min input:disabled{opacity:.2}
  .min span{color:var(--dim2);font-size:11px;margin-left:3px}
  tr.hide{display:none}

  .seq{color:var(--dim2);font-size:11px;width:26px;padding-top:11px;text-align:right;
    font-variant-numeric:tabular-nums}

  footer{position:fixed;bottom:0;left:0;right:0;background:rgba(14,17,23,.96);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 24px;
    display:flex;gap:11px;align-items:center;font-size:12.5px;color:var(--dim2)}
  footer button{background:var(--panel);border:1px solid var(--line);color:var(--tx);
    border-radius:6px;padding:6px 13px;font:12.5px/1.3 inherit;cursor:pointer}
  footer button:hover{border-color:#3f5878}

  #out{position:fixed;inset:5% 10%;background:var(--panel);border:1px solid var(--line);
    border-radius:11px;padding:17px;z-index:40;display:none;flex-direction:column}
  #out textarea{flex:1;width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);
    border-radius:7px;padding:13px;font:12.5px/1.65 Consolas,monospace;resize:none}
  #out .x{align-self:flex-end;margin-top:10px}
</style>
</head>
<body>

<header>
  <h1>AgentParty — 기능 목록 & 발표 배분</h1>
  <div class="sub"><b>docs/기능정의서.md</b> 의 세부기능 78개를 정본 그대로 옮겼습니다. 행을 클릭하면 문서의 <b>범위</b>가 펼쳐집니다.</div>

  <div class="modes">
    <button class="on" data-m="doc">기능 목록 (문서 순서)</button>
    <button data-m="run">발표 순서 (드래그로 조정)</button>
  </div>

  <div class="bar">
    <div class="budget">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="btime"><span>앞에서 쓰는 시간 <b id="tmin">0</b>분 / 목표 <b>15</b>분 <span id="tsplit" style="color:var(--dim2)"></span></span><span id="tover"></span></div>
    </div>
    <div class="counts">
      <div class="cnt d">시연<b id="c0">0</b></div>
      <div class="cnt i">소개<b id="c1">0</b></div>
      <div class="cnt k">목업<b id="c2">0</b></div>
      <div class="cnt s">슬라이드<b id="c3">0</b></div>
      <div class="cnt x">생략<b id="c4">0</b></div>
      <div class="cnt">전체<b id="ct">0</b></div>
    </div>
  </div>

  <div class="filters" id="filters">
    <button class="f on" data-f="all">전체</button>
    <button class="f" data-f="0">시연</button>
    <button class="f" data-f="1">소개</button>
    <button class="f" data-f="2">목업</button>
    <button class="f" data-f="3">슬라이드</button>
    <button class="f" data-f="4">생략</button>
    <button class="f" data-f="star">⭐ 차별 기능</button>
    <button class="f" data-f="warn">⚠ 제약 있음</button>
    <span class="spacer"></span>
    <button class="f ghost" id="expand">범위 모두 펼치기</button>
    <button class="f ghost" id="reset">추천값·문서순서로 되돌리기</button>
  </div>
</header>

<main id="main"></main>

<footer>
  <button id="export">발표 대본 뽑기</button>
  <button id="savefile">파일로 저장 (에이전트가 읽음)</button>
  <span><b style="color:var(--demo)">시연</b> 실제로 동작시켜 보여줌 · <b style="color:var(--intro)">소개</b> 화면만 보여주고 넘어감 · <b style="color:var(--mock)">목업</b> 화면을 미리 만들어 둠 · <b style="color:var(--slide)">슬라이드</b> 말로만 · 판정·순서 자동 저장</span>
</footer>

<div id="out">
  <textarea id="outtx" readonly></textarea>
  <button class="x" onclick="document.getElementById('out').style.display='none'">닫기</button>
</div>

["5-3. 로그와 캡처",[
["5-3-1","로그","앱 동작 기록을 남기고 위치를 알려주는 동작 영역.",
 "현재 로그 파일 경로 조회 · Electron user-data 디렉터리에 NDJSON 저장",[],0,3,0,""],
["5-3-2","화면 캡처","현재 창을 이미지 파일로 저장하는 동작 영역.","PNG 캡처",[],0,3,0,""]]],
["5-4. QA 모드",[
["5-4-1","QA 지원","실제 모델 호출 없이 화면 상태를 구성하고 그 기능을 평시에 막는 동작 영역.",
 "가상 파티·멤버 생성 · transcript 이벤트 주입 · 승인 요청과 사용자 질문 주입 · 서브에이전트 시나리오 주입 · 임의 패널·탭 배치 · 사용 한도 데이터 주입 · Message Gate 화면 열기 · QA 데이터 초기화 · QA 모드가 아닐 때 <code>/api/qa/*</code> 거부",
 [],0,2,0,"⭐ 발표 안전판 — 목업 판정 항목은 대부분 이걸로 실제 화면을 만들 수 있다"]]]
]],
];

const KEY="ap-plan-v3";
const VN=["시연","소개","목업","슬라이드","생략"], VC=["demo","intro","mock","slide","skip"];

/* 사용자가 2026-08-13 13:40 에 확정한 배분. [판정, 분, 순서]
   판정 0시연 1소개 2목업 3슬라이드 4생략. `되돌리기` 는 이 값으로 돌아간다. */
const BASE={
"1-1-1":[0,1,0],"1-3-1":[0,1,1],"1-3-2":[0,.5,2],"1-3-3":[0,.5,3],"1-4-1":[0,2,4],
"1-4-2":[0,1.5,5],"1-4-3":[0,.5,6],"1-5-1":[0,.5,7],"1-6-1":[0,1,8],"1-6-2":[0,0,9],
"1-7-1":[0,.5,10],"1-7-2":[0,.5,11],"1-7-3":[0,.5,12],"1-7-4":[3,0,13],"1-7-5":[0,.5,14],
"1-8-1":[0,1,15],"1-9-1":[0,.5,16],"1-9-2":[0,1,17],"1-9-3":[2,0,18],"1-10-1":[2,0,19],
"1-10-2":[2,0,20],"1-11-1":[0,.5,21],"1-12-1":[0,.5,22],"1-12-2":[0,.5,23],"1-13-2":[0,.5,24],
"1-14-1":[0,.5,25],"1-14-2":[0,.5,26],"1-15-1":[0,2,27],"1-15-2":[0,.5,28],"1-16-1":[0,.5,29],
"1-16-2":[0,1.5,30],"1-17-1":[2,0,31],"1-17-2":[2,0,32],"1-18-1":[0,.5,33],"1-18-2":[0,.5,34],
"1-19-1":[0,2,35],"2-0-0":[0,.5,36],"3-1-1":[0,.5,37],"3-2-1":[0,.5,38],"3-3-1":[0,.5,39],
"3-4-1":[0,.5,40],"3-5-1":[0,.5,41],
"1-1-2":[4,0,42],"1-2-1":[4,0,43],"1-2-2":[4,0,44],"1-5-2":[4,0,45],"1-5-3":[4,0,46],
"1-6-3":[4,0,47],"1-6-4":[4,0,48],"1-8-2":[4,0,49],"1-8-3":[4,0,50],"1-9-4":[4,0,51],
"1-9-5":[4,0,52],"1-11-2":[4,0,53],"1-13-1":[4,0,54],"1-13-3":[4,0,55],"1-13-4":[4,0,56],
"1-19-2":[4,0,57],"1-20-1":[4,0,58],"1-20-2":[4,0,59],"1-20-3":[4,0,60],"1-20-4":[4,0,61],
"3-1-2":[4,0,62],"3-2-2":[4,0,63],"3-5-2":[4,0,64],"4-1-1":[4,0,65],"4-2-1":[4,0,66],
"4-3-1":[4,0,67],"4-3-2":[4,0,68],"4-4-1":[4,0,69],"4-4-2":[4,0,70],"5-1-1":[4,0,71],
"5-1-2":[4,0,72],"5-2-1":[4,0,73],"5-2-2":[4,0,74],"5-3-1":[4,0,75],"5-3-2":[4,0,76],
"5-4-1":[4,0,77]};

let saved={}; try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}

const rows=[];
CONTENTS.forEach(([ctitle,ctag,groups])=>groups.forEach(([gtitle,items])=>
  items.forEach(([id,name,def,scope,warns,star,dv,dm,note])=>{
    const b=BASE[id]||[dv,dm,rows.length], st=saved[id]||{};
    rows.push({id,name,def,scope,warns,star,note,ctitle,ctag,gtitle,
      v:st.v??b[0],m:st.m??b[1],ord:st.ord??b[2],dv:b[0],dm:b[1],dord:b[2],open:false});
  })));

const main=document.getElementById("main");
let mode="doc", filter="all", dragId=null;

function rowHTML(r,seq){
  const w=r.warns.map(t=>'<span class="w">⚠ '+t.replace(/^🔒 /,'')+'</span>').join("");
  return (mode==="run"?'<td class="seq">'+seq+'</td>':'')+
    '<td class="hd">'+(mode==="run"?"⠿":"")+'</td>'+
    '<td class="id">'+r.id+'</td>'+
    '<td class="nm">'+r.name+(r.star?'<span class="star">⭐</span>':'')+
      (mode==="run"?'<span class="area">'+r.gtitle+'</span>':'')+'</td>'+
    '<td class="ds">'+r.def+'<span class="more">범위 ▾</span>'+w+
      (r.note?'<span class="note">'+r.note+'</span>':'')+
      '<span class="sc"><b>범위</b> — '+r.scope+'</span></td>'+
    '<td class="verdict"><button class="v"></button></td>'+
    '<td class="min"><input type="number" min="0" step="0.5"><span>분</span></td>';
}

function bind(tr,r){
  tr.querySelector(".v").onclick=e=>{e.stopPropagation();
    r.v=(r.v+1)%5;
    if(r.v<=1&&!r.m)r.m=r.v===0?(r.dm||0.5):0.5;
    render()};
  const inp=tr.querySelector("input");
  inp.onclick=e=>e.stopPropagation();
  inp.oninput=()=>{r.m=parseFloat(inp.value)||0; save(); meter()};
  tr.querySelector(".nm").onclick=()=>{r.open=!r.open; tr.classList.toggle("open",r.open)};
  tr.querySelector(".ds").onclick=()=>{r.open=!r.open; tr.classList.toggle("open",r.open)};
  tr.querySelector(".v").textContent=VN[r.v];
  tr.querySelector(".v").className="v "+VC[r.v];
  inp.value=r.v<=1?r.m:""; inp.disabled=r.v>1;
  tr.classList.toggle("open",r.open);

  if(mode==="run"){
    tr.draggable=true;
    tr.ondragstart=e=>{dragId=r.id; tr.classList.add("drag"); e.dataTransfer.effectAllowed="move"};
    tr.ondragend=()=>{dragId=null; document.querySelectorAll("tr.row").forEach(x=>x.classList.remove("drag","over"))};
    tr.ondragover=e=>{e.preventDefault(); if(dragId&&dragId!==r.id)tr.classList.add("over")};
    tr.ondragleave=()=>tr.classList.remove("over");
    tr.ondrop=e=>{e.preventDefault(); tr.classList.remove("over");
      if(!dragId||dragId===r.id)return;
      const list=visible(), from=list.findIndex(x=>x.id===dragId), to=list.findIndex(x=>x.id===r.id);
      const [moved]=list.splice(from,1); list.splice(to,0,moved);
      list.forEach((x,i)=>x.ord=i);
      let n=list.length; rows.filter(x=>!list.includes(x)).forEach(x=>x.ord=n++);
      render()};
  }
}

function visible(){
  return rows.filter(r=>r.v!==4).sort((a,b)=>a.ord-b.ord);
}
function pass(r){
  return filter==="all"||(filter==="star"&&r.star)||
    (filter==="warn"&&r.warns.length)||String(r.v)===filter;
}

function render(){
  main.innerHTML="";
  if(mode==="doc"){
    let lastC=null;
    CONTENTS.forEach(([ctitle,ctag,groups])=>{
      const cd=document.createElement("div"); cd.className="ct"; cd.textContent=ctitle+" — "+ctag;
      main.appendChild(cd);
      groups.forEach(([gtitle,items])=>{
        const list=items.map(it=>rows.find(r=>r.id===it[0])).filter(pass);
        if(!list.length)return;
        const h=document.createElement("h2"); h.innerHTML=gtitle;
        main.appendChild(h);
        const t=document.createElement("table"); main.appendChild(t);
        list.forEach(r=>{const tr=document.createElement("tr"); tr.className="row";
          tr.innerHTML=rowHTML(r); t.appendChild(tr); bind(tr,r)});
      });
    });
  }else{
    const h=document.createElement("div"); h.className="ct";
    h.textContent="발표 순서 — 행을 끌어 순서를 바꾸세요 (생략 항목은 빠집니다)";
    main.appendChild(h);
    const t=document.createElement("table"); main.appendChild(t);
    visible().filter(pass).forEach((r,i)=>{const tr=document.createElement("tr"); tr.className="row";
      tr.innerHTML=rowHTML(r,i+1); t.appendChild(tr); bind(tr,r)});
  }
  meter(); save();
}

function meter(){
  let td=0,ti=0,c=[0,0,0,0,0];
  rows.forEach(r=>{c[r.v]++; if(r.v===0)td+=r.m; else if(r.v===1)ti+=r.m});
  td=Math.round(td*10)/10; ti=Math.round(ti*10)/10;
  const tot=Math.round((td+ti)*10)/10;
  tsplit.textContent="(시연 "+td+" + 소개 "+ti+")";
  tmin.textContent=tot; c0.textContent=c[0]; c1.textContent=c[1];
  c2.textContent=c[2]; c3.textContent=c[3]; c4.textContent=c[4];
  ct.textContent=rows.length;
  fill.style.width=Math.min(100,tot/15*100)+"%";
  fill.className="fill"+(tot>15?" over":"");
  tover.textContent=tot>15?("⚠ "+Math.round((tot-15)*10)/10+"분 초과"):
    tot<15?("여유 "+Math.round((15-tot)*10)/10+"분"):"딱 맞음";
}
function save(){const o={};rows.forEach(r=>o[r.id]={v:r.v,m:r.m,ord:r.ord});
  localStorage.setItem(KEY,JSON.stringify(o))}

document.querySelectorAll(".modes button").forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;
  document.querySelectorAll(".modes button").forEach(x=>x.classList.toggle("on",x===b));
  render()});
document.querySelectorAll("#filters .f[data-f]").forEach(b=>b.onclick=()=>{
  filter=b.dataset.f;
  document.querySelectorAll("#filters .f[data-f]").forEach(x=>x.classList.toggle("on",x===b));
  render()});
document.getElementById("expand").onclick=()=>{
  const any=rows.some(r=>!r.open); rows.forEach(r=>r.open=any); render()};
document.getElementById("reset").onclick=()=>{
  rows.forEach(r=>{r.v=r.dv;r.m=r.dm;r.ord=r.dord});
  localStorage.removeItem(KEY); render()};

document.getElementById("export").onclick=()=>{
  const V=visible();
  let s="# AgentParty 발표 대본\n\n라이브 시연 "+tmin.textContent+"분 · 소개 "+c1.textContent+
    "건 · 목업 "+c2.textContent+"건 · 슬라이드 "+c3.textContent+"건\n\n---\n\n";
  V.forEach((r,i)=>{
    s+="## "+(i+1)+". ["+VN[r.v]+(r.v<=1?" "+r.m+"분":"")+"] "+r.name+(r.star?" ⭐":"")+"  `"+r.id+"`\n\n";
    s+=r.def+"\n\n";
    s+="- 범위: "+r.scope.replace(/<[^>]+>/g,"")+"\n";
    r.warns.forEach(w=>s+="- ⚠ "+w.replace(/<[^>]+>/g,"")+"\n");
    if(r.note)s+="- 메모: "+r.note+"\n";
    s+="\n";
  });
  const sk=rows.filter(r=>r.v===4);
  if(sk.length)s+="---\n\n## 발표에서 다루지 않음 ("+sk.length+")\n\n"+sk.map(r=>r.id+" "+r.name).join(" · ")+"\n";
  outtx.value=s; out.style.display="flex"; outtx.select();
};

document.getElementById("savefile").onclick=()=>{
  const V=visible();
  const plan={
    savedAt:new Date().toLocaleString("ko-KR"),
    demoMinutes:Number(tmin.textContent),
    counts:{시연:+c0.textContent,소개:+c1.textContent,목업:+c2.textContent,
            슬라이드:+c3.textContent,생략:+c4.textContent},
    order:V.map((r,i)=>({순번:i+1,id:r.id,이름:r.name,판정:VN[r.v],분:r.v<=1?r.m:null})),
    생략:rows.filter(r=>r.v===4).map(r=>({id:r.id,이름:r.name}))
  };
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(plan,null,2)],{type:"application/json"}));
  a.download="agentparty-plan.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};

render();
</script>
</body>
</html>
