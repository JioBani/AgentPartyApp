<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentParty</title>
    <script>
      /* Same rules as firstPaintFrom() in src/shared/appTheme.ts. Preload
         exposes window.agentPartyAppearanceBoot from main (settings+nativeTheme)
         before this runs. localStorage is only used when settings has no theme. */
      (function () {
        try {
          var boot = window.agentPartyAppearanceBoot;
          var legacy = null;
          try { legacy = localStorage.getItem("agentparty.theme"); } catch (e) {}
          var pref;
          var applied;
          if (boot && boot.stored) {
            pref = boot.preference;
            applied = boot.applied;
          } else if (legacy === "dark") {
            pref = "dark";
            applied = "dark";
          } else if (boot && boot.preference && boot.applied) {
            pref = boot.preference;
            applied = boot.applied;
          } else {
            pref = "light";
            applied = "light";
          }
          document.documentElement.setAttribute("data-theme", applied);
          document.documentElement.setAttribute("data-theme-preference", pref);
          document.documentElement.setAttribute("data-theme-paint", "sync");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
