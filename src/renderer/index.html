<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentParty</title>
    <script>
      /* Keep keys in sync with src/shared/appTheme.ts. Runs before the module
         bundle so the first paint already has data-theme, not a light :root. */
      (function () {
        try {
          var pref = localStorage.getItem("agentparty.themePreference")
            || localStorage.getItem("agentparty.theme");
          if (pref !== "system" && pref !== "light" && pref !== "dark") pref = "light";
          var dark = pref === "dark" || (pref === "system" && window.matchMedia
            && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme-preference", pref);
          document.documentElement.setAttribute("data-theme-paint", "sync");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
